<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت گیم‌نت</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>مدیریت گیم‌نت</h1>
            <div class="controls">
                <button id="report-btn">گزارشات</button>
                <button id="add-station-btn">افزودن سیستم</button>
                <button id="manual-entry-btn">ورود دستی</button>
                <button id="settings-btn" title="تنظیمات"><i class="fas fa-cog"></i></button>
                <div class="theme-switcher">
                    <label for="theme-toggle">حالت تاریک</label>
                    <input type="checkbox" id="theme-toggle">
                </div>
            </div>
        </header>

        <main>
            <div id="stations-container" class="stations-container">
                <!-- Station cards will be dynamically added here -->
            </div>
        </main>

        <aside class="sidebar">
            <h2>محصولات</h2>
            <div id="products-list">
                <!-- Products will be listed here -->
            </div>
            <div class="add-product-form">
                <h3>افزودن محصول جدید</h3>
                <input type="text" id="product-name-input" placeholder="نام محصول">
                <input type="number" id="product-price-input" placeholder="قیمت (تومان)">
                <button id="add-product-btn">افزودن محصول</button>
            </div>
        </aside>

    </div>

    <!-- Modal for adding a new station -->
    <div id="add-station-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>افزودن سیستم جدید</h2>
            <input type="text" id="station-name-input" placeholder="نام سیستم (مثلا: PC 1)">
            <input type="number" id="station-rate-input" placeholder="نرخ هر ساعت (تومان)">
            <input type="number" id="station-duration-input" placeholder="مدت زمان (دقیقه) - اختیاری">
            <button id="confirm-add-station-btn">تایید</button>
        </div>
    </div>

    <!-- Modal for showing invoice -->
    <div id="invoice-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>فاکتور نهایی</h2>
            <div id="invoice-details">
                <!-- Invoice details will be populated here -->
            </div>
            <div class="invoice-actions">
                <button id="pay-cash-btn" class="payment-btn">پرداخت نقدی</button>
                <button id="pay-card-btn" class="payment-btn">پرداخت با کارت</button>
            </div>
        </div>
    </div>

    <!-- Report Modal -->
    <div id="report-modal" class="modal" style="display:none;">
        <div class="modal-content large">
            <span class="close-btn">&times;</span>
            <h2>گزارشات و آمار</h2>
            <div class="report-controls">
                <div class="date-filters">
                    <label for="filter-start-date">از تاریخ:</label>
                    <input type="date" id="filter-start-date">
                    <label for="filter-end-date">تا تاریخ:</label>
                    <input type="date" id="filter-end-date">
                </div>
                <div class="search-filter">
                    <input type="search" id="history-search-input" placeholder="جستجوی نام سیستم...">
                </div>
                <div class="report-actions">
                    <button id="export-csv-btn">خروجی CSV</button>
                    <button id="delete-filtered-btn" class="danger-btn">حذف موارد فیلتر شده</button>
                </div>
            </div>
            <div class="report-stats">
                <div class="stat-box">
                    <h4>درآمد کل (امروز)</h4>
                    <p id="stats-today-revenue">۰ تومان</p>
                </div>
                <div class="stat-box">
                    <h4>درآمد کل (مجموع)</h4>
                    <p id="stats-total-revenue">۰ تومان</p>
                </div>
                <div class="stat-box">
                    <h4>تعداد کل تراکنش‌ها</h4>
                    <p id="stats-total-transactions">۰</p>
                </div>
            </div>
            <div class="report-table-container">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>سیستم</th>
                            <th>تاریخ</th>
                            <th>مدت زمان</th>
                            <th>نحوه پرداخت</th>
                            <th>مبلغ کل</th>
                            <th>عملیات</th>
                        </tr>
                    </thead>
                    <tbody id="history-table-body">
                        <!-- History rows will be injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Manual Entry Modal -->
    <div id="manual-entry-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>ورود دستی جلسه</h2>
            <div class="manual-entry-form">
                <label for="manual-station-select">انتخاب سیستم:</label>
                <select id="manual-station-select"></select>

                <label for="manual-start-time">زمان شروع:</label>
                <input type="datetime-local" id="manual-start-time">

                <label for="manual-end-time">زمان پایان:</label>
                <input type="datetime-local" id="manual-end-time">

                <label for="manual-payment-method">نحوه پرداخت:</label>
                <select id="manual-payment-method">
                    <option value="cash">نقدی</option>
                    <option value="card">کارت</option>
                </select>

                <button id="confirm-manual-entry-btn">ثبت جلسه</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>تنظیمات</h2>
            <div class="settings-form">
                <label for="default-rate-input">نرخ ساعتی پیش‌فرض:</label>
                <input type="number" id="default-rate-input" placeholder="مثلا: 20000">

                <button id="save-settings-btn">ذخیره تنظیمات</button>
                <hr>
                <button id="delete-all-history-btn" class="danger-btn">پاک کردن کل تاریخچه</button>
            </div>
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
